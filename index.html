<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oo75 時光隅｜回報工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#faf7f0;
    --panel-2:#f2ede0;
    --line:rgba(0,0,0,0.35);
    --gold:#a5820f;
    --gold-dim:#8f7625;
    --parchment:#2b2620;
    --mist:#4a453d;
    --mist-dim:#8a8375;
    --rust:#a85a2e;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--mist);
    font-family:'Noto Sans TC',sans-serif;
    font-weight:300;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  header{
    border-bottom:1px solid var(--line);
    padding:22px 0;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header .title{
    font-family:'Noto Serif TC',serif;
    color:var(--parchment);
    font-size:20px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  header .title .mark{
    font-family:'Noto Serif TC',serif;
    font-size:20px;
    font-weight:600;
    color:var(--gold);
    margin-right:4px;
    vertical-align:baseline;
  }
  header .title .corner-wrap{
    position:relative;
    display:inline;
    font-family:'Noto Serif TC',serif;
    color:var(--parchment);
    font-size:20px;
    font-weight:600;
  }
  header .title .dot{margin-left:-0.2em;}
  header .title span.sub{color:var(--gold-dim);font-size:13px;margin-left:10px;font-family:'Noto Sans TC',sans-serif;}

  main{
    padding:48px 0 60px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .group-label{
    font-size:12px;
    color:var(--gold-dim);
    letter-spacing:0.12em;
    margin:0 0 18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .group-label::after{content:"";flex:1;height:1px;background:var(--line);}

  .card-grid{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(2,200px);
    gap:24px;
    justify-content:center;
  }
  @media(max-width:680px){
    .card-grid{grid-template-columns:200px;}
  }

  a.tool-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:200px;
    height:100px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    text-decoration:none;
    color:inherit;
    transition:border-color .2s, background .2s, transform .2s;
    text-align:center;
    padding:10px;
    position:relative;
  }
  a.tool-card:hover{
    border-color:var(--gold);
    background:var(--panel-2);
    transform:translateY(-2px);
  }
  a.tool-card h2{
    font-family:'Noto Serif TC',serif;
    color:var(--parchment);
    font-size:19px;
    font-weight:600;
    margin:0;
    line-height:1.6;
  }
  a.tool-card .click{
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    text-align:center;
    font-size:8px;
    letter-spacing:0.08em;
    color:var(--mist-dim);
    font-family:'Noto Sans TC',sans-serif;
  }

  footer{
    border-top:1px solid var(--line);
    padding:18px 0;
    text-align:center;
    font-size:12px;
    color:var(--mist-dim);
  }
</style>
</head>
<body>

<header>
  <div class="wrap" style="display:flex;align-items:baseline;justify-content:space-between;width:100%;flex-wrap:wrap;gap:16px;">
    <div class="title"><span class="mark">oo75</span> 時光<span class="corner-wrap">隅<span class="dot">。</span></span> <span class="mark">Tools</span></div>
  </div>
</header>

<div class="wrap">
  <main>
    <div class="card-grid">
      <a class="tool-card" href="https://reurl.cc/DxQx6Q" target="_blank" rel="noopener">
        <h2>official web</h2>
        <span class="click">click</span>
      </a>
      <a class="tool-card" href="外場回報工具.html">
        <h2>櫃台營業回報</h2>
        <span class="click">click</span>
      </a>
      <a class="tool-card" href="https://www.threads.com/@oo75_ffxiv" target="_blank" rel="noopener">
        <h2>threads</h2>
        <span class="click">click</span>
      </a>
      <a class="tool-card" href="指名回報工具.html">
        <h2>指名營業回報</h2>
        <span class="click">click</span>
      </a>
    </div>
  </main>
</div>

<footer>oo75 時光隅。</footer>

</body>
</html>
